name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Find and rename APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} artifacts/DecMonitor.apk \;

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DecMonitor-APK
          path: artifacts/DecMonitor.apk

      - name: Get version tag
        id: version
        run: echo "tag=v$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Dec Monitor ${{ steps.version.outputs.tag }}"
          body: "Auto-release on push to main"
          files: artifacts/DecMonitor.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
