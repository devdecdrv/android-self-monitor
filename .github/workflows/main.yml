name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Generate app icon
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          convert -size 512x512 xc:'#1a1a2e' \
            -fill '#3a3a5c' -draw "circle 256,256 256,100" \
            -fill '#1a1a2e' -draw "circle 256,256 256,140" \
            -fill '#7c7caa' -draw "circle 256,256 256,170" \
            -fill '#1a1a2e' -draw "circle 256,256 256,200" \
            /tmp/icon_base.png
          convert /tmp/icon_base.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert /tmp/icon_base.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert /tmp/icon_base.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert /tmp/icon_base.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert /tmp/icon_base.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug 2>&1 | tee build_log.txt; exit ${PIPESTATUS[0]}

      - name: Show errors
        if: failure()
        run: grep -E "^e:|error:|Error" build_log.txt | head -50

      - name: Find and rename APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/ -name "*.apk" -exec cp {} artifacts/DecMonitor.apk \;

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DecMonitor-APK
          path: artifacts/DecMonitor.apk

      - name: Get version tag
        id: version
        run: echo "tag=v$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Dec Monitor ${{ steps.version.outputs.tag }}"
          body: "Auto-release on push to main"
          files: artifacts/DecMonitor.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
